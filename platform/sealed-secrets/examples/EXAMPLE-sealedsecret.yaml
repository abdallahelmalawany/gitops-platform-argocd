# EXAMPLE ONLY - PLACEHOLDER CIPHERTEXT. This file is NOT synced by ArgoCD (it lives under an
# "examples" directory that no Application points at) and the value below cannot be decrypted.
#
# Generate a real one against YOUR cluster controller key:
#   kubectl create secret generic demo-web-credentials \
#     --namespace demo-dev --from-literal=API_TOKEN=<value> --dry-run=client -o yaml \
#     | kubeseal --controller-name sealed-secrets-controller --controller-namespace kube-system -o yaml \
#     > environments/dev/sealedsecret-demo-web-credentials.yaml
# See scripts/seal-secret.sh.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: demo-web-credentials
  namespace: demo-dev
spec:
  encryptedData:
    API_TOKEN: AgPLACEHOLDER_NOT_REAL_CIPHERTEXT_REPLACE_WITH_KUBESEAL_OUTPUT
  template:
    metadata:
      name: demo-web-credentials
      namespace: demo-dev
    type: Opaque
