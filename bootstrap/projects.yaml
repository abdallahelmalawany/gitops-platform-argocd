apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
spec:
  description: Cluster-wide platform components (ingress, certs, monitoring, policy)
  sourceRepos:
    - https://github.com/abdallahelmalawany/gitops-platform-argocd.git
    - https://kubernetes.github.io/ingress-nginx
    - https://charts.jetstack.io
    - https://bitnami-labs.github.io/sealed-secrets
    - https://prometheus-community.github.io/helm-charts
    - https://kyverno.github.io/kyverno
  destinations:
    - namespace: "*"
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: workloads
  namespace: argocd
spec:
  description: Application workloads, one namespace per environment
  sourceRepos:
    - https://github.com/abdallahelmalawany/gitops-platform-argocd.git
  destinations:
    - namespace: demo-*
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceBlacklist:
    - group: ""
      kind: ResourceQuota
      # Quotas are owned by the env-baseline app, not by workload charts
